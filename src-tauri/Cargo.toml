[package]
name="MarkNotes"
version="1.0.0"
edition="2024"
[lib]
name="marknotes"
crate-type= ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build= {version="2",features= [] }
[dependencies]
tauri= {version="2",features= ["devtools"] }
tauri-plugin-dialog="2"
tauri-plugin-fs="2"
tauri-plugin-single-instance="2"
serde= {version="1",features= ["derive"] }
serde_json="1"
