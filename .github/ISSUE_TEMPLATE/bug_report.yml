name: Bug report
description: Report a reproducible problem in MarkNotes
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MarkNotes. Do not include secrets or confidential documents.

  - type: input
    id: version
    attributes:
      label: Application version
      description: Open the installed application properties or provide the release tag.
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open a Markdown file
        2. Select ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Minimal Markdown sample
      description: Use a small, anonymized example. Do not attach confidential content.
      render: markdown

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only information that is safe to share publicly.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed confidential or personal information.
          required: true
