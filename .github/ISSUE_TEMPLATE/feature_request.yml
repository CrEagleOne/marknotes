name: Feature request
description: Suggest an improvement for MarkNotes
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: Thank you for proposing an improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need rather than only the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected workflow and result.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other designs you considered.

  - type: dropdown
    id: area
    attributes:
      label: Feature area
      options:
        - Editor
        - Markdown preview
        - Toolbar and formatting
        - File operations
        - PDF export
        - Desktop integration
        - Accessibility
        - Build and release
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions first.
          required: true
